<script>
  let bancoCotacoesJson = {};

  async function carregarCotacoesGitHub() {
    try {
      const resposta = await fetch('./cotacoes.json?t=' + new Date().getTime());
      if (!resposta.ok) throw new Error('JSON ainda não gerado');
      const dados = await resposta.json();
      bancoCotacoesJson = dados.ativos || {};
      const listaPrincipais = dados.principais || Object.keys(bancoCotacoesJson).slice(0, 12);

      const select = document.getElementById('sim-ticker-select');
      select.innerHTML = '';

      // 1. Preenche o Select apenas com os ativos principais
      for (const ticker of listaPrincipais) {
        const info = bancoCotacoesJson[ticker];
        if (!info) continue;
        const opt = document.createElement('option');
        opt.value = ticker;
        opt.setAttribute('data-preco', info.preco);
        opt.setAttribute('data-dy', info.dy);
        opt.textContent = `${ticker} - ${info.nome} (R$ ${info.preco.toFixed(2).replace('.', ',')})`;
        select.appendChild(opt);
      }

      const optCustom = document.createElement('option');
      optCustom.value = 'CUSTOM';
      optCustom.setAttribute('data-preco', '20.00');
      optCustom.setAttribute('data-dy', '6.0');
      optCustom.textContent = '✏️ Digitar outro Ticker da B3...';
      select.appendChild(optCustom);

      // 2. Cria uma lista de sugestões (datalist) com os 150+ ativos do Python
      let datalist = document.getElementById('lista-tickers-b3');
      if (!datalist) {
        datalist = document.createElement('datalist');
        datalist.id = 'lista-tickers-b3';
        document.body.appendChild(datalist);
      }
      datalist.innerHTML = '';
      for (const [ticker, info] of Object.entries(bancoCotacoesJson)) {
        const item = document.createElement('option');
        item.value = ticker;
        item.label = `R$ ${info.preco.toFixed(2)} | DY: ${info.dy.toFixed(1)}%`;
        datalist.appendChild(item);
      }

      const inputCustom = document.getElementById('sim-custom-name');
      inputCustom.setAttribute('list', 'lista-tickers-b3');
      inputCustom.setAttribute('oninput', 'puxarTickerDoPython()');

      document.getElementById('status-cotacoes').innerHTML = 
        `🟢 Python GitHub: <strong>${Object.keys(bancoCotacoesJson).length} ativos B3</strong> atualizados em <strong>${dados.atualizado_em}</strong>`;

      atualizarDadosAtivo();
    } catch (erro) {
      document.getElementById('status-cotacoes').innerHTML = 
        `⚪ Modo manual ativo (valores de referência editáveis)`;
      atualizarDadosAtivo();
    }
  }

  // Puxa instantaneamente do arquivo gerado pelo Python no GitHub ao digitar!
  function puxarTickerDoPython() {
    const ticker = document.getElementById('sim-custom-name').value.trim().toUpperCase();
    const info = bancoCotacoesJson[ticker];

    if (info) {
      document.getElementById('sim-preco').value = info.preco.toFixed(2);
      document.getElementById('sim-dy').value = info.dy.toFixed(1);
      atualizarPrecoTeto();
    }
  }

  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function formatarNumero(valor) {
    return Math.ceil(valor).toLocaleString('pt-BR');
  }

  function enviarAlturaParaBlogger() {
    const altura = document.documentElement.scrollHeight;
    window.parent.postMessage({ tipo: 'redimensionarSimulador', altura: altura }, '*');
  }

  function atualizarDadosAtivo() {
    var select = document.getElementById('sim-ticker-select');
    var option = select.options[select.selectedIndex];
    var boxCustom = document.getElementById('box-custom-ticker');

    if (select.value === 'CUSTOM') {
      boxCustom.style.display = 'block';
      puxarTickerDoPython();
    } else {
      boxCustom.style.display = 'none';
      document.getElementById('sim-preco').value = parseFloat(option.getAttribute('data-preco')).toFixed(2);
      document.getElementById('sim-dy').value = parseFloat(option.getAttribute('data-dy')).toFixed(1);
      atualizarPrecoTeto();
    }
    enviarAlturaParaBlogger();
  }

  function atualizarPrecoTeto() {
    var preco = parseFloat(document.getElementById('sim-preco').value) || 0;
    var dy = parseFloat(document.getElementById('sim-dy').value) || 0;
    var dpa = preco * (dy / 100);
    var precoTetoBazin = dpa / 0.06;

    document.getElementById('lbl-dpa').innerText = formatarMoeda(dpa) + '/ano';
    document.getElementById('lbl-teto').innerText = formatarMoeda(precoTetoBazin);
  }

  function calcularSimulacaoAcoes() {
    var select = document.getElementById('sim-ticker-select');
    var ticker = select.value === 'CUSTOM' 
      ? (document.getElementById('sim-custom-name').value.trim().toUpperCase() || 'ATIVO')
      : select.value;

    var preco = parseFloat(document.getElementById('sim-preco').value) || 0;
    var dyAnual = parseFloat(document.getElementById('sim-dy').value) || 0;
    var idadeAtual = parseInt(document.getElementById('sim-idade-atual').value) || 30;
    var idadeAposentar = parseInt(document.getElementById('sim-idade-aposentar').value) || 60;
    var rendaMensalDesejada = parseFloat(document.getElementById('sim-renda').value) || 0;
    var aporteInicial = parseFloat(document.getElementById('sim-inicial').value) || 0;

    if (preco <= 0 || dyAnual <= 0 || rendaMensalDesejada <= 0) {
      alert('Por favor, preencha valores maiores que zero para cotação, Dividend Yield e renda desejada.');
      return;
    }

    if (idadeAposentar <= idadeAtual) {
      alert('A idade de aposentadoria deve ser maior que a sua idade atual.');
      return;
    }

    var anos = idadeAposentar - idadeAtual;
    var meses = anos * 12;

    var dyDecimalAnual = dyAnual / 100;
    var taxaMensal = Math.pow(1 + dyDecimalAnual, 1 / 12) - 1;

    var rendaAnualDesejada = rendaMensalDesejada * 12;
    var patrimonioNecessario = rendaAnualDesejada / dyDecimalAnual;
    var acoesNecessarias = Math.ceil(patrimonioNecessario / preco);

    var fvInicial = aporteInicial * Math.pow(1 + taxaMensal, meses);
    var faltaAcumular = Math.max(0, patrimonioNecessario - fvInicial);

    var fatorAcumulacao = (Math.pow(1 + taxaMensal, meses) - 1) / taxaMensal;
    var aporteMensalNecessario = faltaAcumular / fatorAcumulacao;
    var acoesPorMes = Math.ceil(aporteMensalNecessario / preco);

    var totalTiradoDoBolso = aporteInicial + (aporteMensalNecessario * meses);
    var pagoPelosDividendos = Math.max(0, patrimonioNecessario - totalTiradoDoBolso);

    document.getElementById('res-cotas').innerText = formatarNumero(acoesNecessarias) + ' cotas/ações de ' + ticker;
    document.getElementById('res-patrimonio').innerText = 'Patrimônio necessário: ' + formatarMoeda(patrimonioNecessario);
    document.getElementById('res-aporte-mensal').innerText = formatarMoeda(aporteMensalNecessario) + ' / mês';
    document.getElementById('res-acoes-mes').innerText = '~' + formatarNumero(acoesPorMes) + ' cotas / mês';
    document.getElementById('res-total-bolso').innerText = formatarMoeda(totalTiradoDoBolso);
    document.getElementById('res-efeito-bola').innerText = formatarMoeda(pagoPelosDividendos);

    document.getElementById('res-resumo-texto').innerHTML = 
      '<strong>Como funciona na prática:</strong> Investindo <strong>' + formatarMoeda(aporteMensalNecessario) + '</strong> todos os meses durante <strong>' + anos + ' anos</strong> e reinvestindo 100% dos dividendos recebidos de <strong>' + ticker + '</strong>, você acumulará as <strong>' + formatarNumero(acoesNecessarias) + ' cotas/ações</strong> necessárias para receber <strong>' + formatarMoeda(rendaMensalDesejada) + ' por mês</strong>, sem precisar vender nenhuma ação.';

    document.getElementById('sim-results-area').style.display = 'block';
    setTimeout(enviarAlturaParaBlogger, 100);
  }

  window.addEventListener('DOMContentLoaded', carregarCotacoesGitHub);
  window.addEventListener('resize', enviarAlturaParaBlogger);
</script>
